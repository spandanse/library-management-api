services:

  postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: library_management_db

    volumes:
      - library-db-data:/var/lib/postgresql

    networks:
      - library-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_management_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .

    env_file:
      - .env

    environment:
      DB_HOST: postgres

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - library-network

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/user-spandan-sen/Documents/bookFrontend:/usr/share/nginx/html:ro

    depends_on:
      api:
        condition: service_healthy

    networks:
      - library-network

volumes:

  library-db-data:


networks:

  library-network: